# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    avatars_directory: '%kernel.project_dir%/public/uploads/avatars'
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    gemini.model: '%env(resolve:GEMINI_MODEL)%'
    voicerss.api_key: '%env(VOICERSS_API_KEY)%'
    python_exe: '%env(resolve:PYTHON_EXE)%'
    openrouter.app_url: '%env(OPENROUTER_APP_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\GeminiClient:
        arguments:
            $apiKey: '%gemini.api_key%'
            $model: '%gemini.model%'

    App\Service\GoogleCalendarService:
        arguments:
            $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
            $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Service\FaceRecognitionService:
        arguments:
            $faceApiUrl: '%env(FACE_API_URL)%'

    # Default OpenRouter client (Chatbot)
    App\Service\OpenRouterClient:
        arguments:
            $apiKey: '%env(OPENROUTER_API_KEY)%'
            $model: '%env(OPENROUTER_MODEL)%'
            $appUrl: '%openrouter.app_url%'
            $appTitle: '%env(OPENROUTER_APP_TITLE)%'

    # Dedicated client for Quiz Generation
    app.quiz_api_client:
        class: App\Service\OpenRouterClient
        arguments:
            $apiKey: '%env(QUIZ_API_KEY)%'
            $model: '%env(QUIZ_MODEL)%'
            $appUrl: '%openrouter.app_url%'
            $appTitle: "Studly Quiz Generator"

    App\Service\AiActivityGeneratorService:
        arguments:
            $client: '@app.quiz_api_client'

    App\Service\VoiceRssService:
        arguments:
            $apiKey: '%voicerss.api_key%'

    App\Service\SmartPlanningService:
        arguments:
            $pythonExe: '%python_exe%'
