# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    avatars_directory: '%kernel.project_dir%/public/uploads/avatars'
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    gemini.model: '%env(resolve:GEMINI_MODEL)%'
    voicerss.api_key: '%env(VOICERSS_API_KEY)%'
    openrouter.api_key: '%env(OPENROUTER_API_KEY)%'
    openrouter.model: '%env(resolve:OPENROUTER_MODEL)%'
    openrouter.app_url: '%env(resolve:OPENROUTER_APP_URL)%'
    openrouter.app_title: '%env(resolve:OPENROUTER_APP_TITLE)%'
    recommendation_api_url: '%env(RECOMMENDATION_API_URL)%'
    python_exe: '%env(PYTHON_EXE)%'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\GeminiClient:
        arguments:
            $apiKey: '%gemini.api_key%'
            $model: '%gemini.model%'

    App\Service\OpenRouterClient:
        arguments:
            $apiKey: '%openrouter.api_key%'
            $model: '%openrouter.model%'
            $appUrl: '%openrouter.app_url%'
            $appTitle: '%openrouter.app_title%'

    App\Service\GoogleCalendarService:
        arguments:
            $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
            $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

    App\Service\RecommendationService:
        arguments:
            $recommendationApiUrl: '%recommendation_api_url%'

    App\Service\FaceRecognitionService:
        arguments:
            $faceApiUrl: '%env(FACE_API_URL)%'



    App\Service\VoiceRssService:
        arguments:
            $apiKey: '%voicerss.api_key%'

    App\Service\SmartPlanningService:
        arguments:
            $pythonExe: '%env(PYTHON_EXE)%'

